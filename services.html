<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC | Services</title>
  <script>(function(){var l='ar';try{l=localStorage.getItem('spc_lang')||'ar';if(!sessionStorage.getItem('spc_intro'))document.documentElement.classList.add('show-intro');}catch(e){}var h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-banner">
      <img class="banner-bg" src="assets/img/image-2.jpg" alt="">
      <div class="container">
        <div class="crumbs"><a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="nav.services"></span></div>
        <h1 data-i18n="services.title"></h1>
        <p data-i18n="services.sub"></p>
      </div>
    </div>

    <section>
      <div class="container about-grid">
        <div class="reveal">
          <div class="section-head start" style="margin-bottom:16px">
            <span class="kicker" data-i18n="services.painKicker"></span>
            <h2 data-i18n="services.painTitle"></h2>
          </div>
          <p class="muted" data-i18n="services.painText"></p>
          <a href="book.html" class="btn btn-primary"><i class="fa-regular fa-calendar-check"></i><span data-i18n="nav.book"></span></a>
        </div>
        <div class="reveal"><img src="assets/img/image-4.jpg" alt="" style="border-radius:var(--radius);width:100%"></div>
      </div>
    </section>

    <section class="section-alt">
      <div class="container" id="services-list"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/services.js"></script>
</body>
</html>
