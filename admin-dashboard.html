<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC | Admin</title>
  <script>(function(){var l='ar';try{l=localStorage.getItem('spc_lang')||'ar';if(!sessionStorage.getItem('spc_intro'))document.documentElement.classList.add('show-intro');}catch(e){}var h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="dash" id="dash">
    <aside class="dash-side">
      <div class="dash-user" id="dash-user"></div>
      <nav class="dash-nav">
        <button data-tab="overview"><i class="fa-solid fa-house"></i><span data-i18n="dash.overview"></span></button>
        <button data-tab="finance"><i class="fa-solid fa-sack-dollar"></i><span data-i18n="dash.finance"></span></button>
        <button data-tab="billing"><i class="fa-solid fa-tags"></i><span data-i18n="dash.billing"></span></button>
        <button data-tab="doctors"><i class="fa-solid fa-user-doctor"></i><span data-i18n="dash.doctors"></span></button>
        <button data-tab="patients"><i class="fa-solid fa-hospital-user"></i><span data-i18n="dash.patients"></span></button>
        <button data-tab="cases"><i class="fa-solid fa-notes-medical"></i><span data-i18n="dash.cases"></span></button>
        <button data-tab="appointments"><i class="fa-regular fa-calendar"></i><span data-i18n="dash.appointments"></span></button>
        <button data-tab="messages"><i class="fa-regular fa-envelope"></i><span data-i18n="dash.messages"></span><span class="count" id="msg-count"></span></button>
      </nav>
    </aside>
    <div class="dash-main">
      <div data-pane="overview"></div>
      <div data-pane="finance" class="hidden"></div>
      <div data-pane="billing" class="hidden"></div>
      <div data-pane="doctors" class="hidden"></div>
      <div data-pane="patients" class="hidden"></div>
      <div data-pane="cases" class="hidden"></div>
      <div data-pane="appointments" class="hidden"></div>
      <div data-pane="messages" class="hidden"></div>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/dash.js"></script>
  <script src="assets/js/cases.js"></script>
  <script src="assets/js/pages/finance.js"></script>
  <script src="assets/js/pages/admin.js"></script>
</body>
</html>
