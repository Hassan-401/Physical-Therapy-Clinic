<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC | My dashboard</title>
  <script>(function(){var l='ar';try{l=localStorage.getItem('spc_lang')||'ar';if(!sessionStorage.getItem('spc_intro'))document.documentElement.classList.add('show-intro');}catch(e){}var h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="dash" id="dash">
    <aside class="dash-side">
      <div class="dash-user" id="dash-user"></div>
      <nav class="dash-nav">
        <button data-tab="overview"><i class="fa-solid fa-house"></i><span data-i18n="dash.overview"></span></button>
        <button data-tab="appointments"><i class="fa-regular fa-calendar"></i><span data-i18n="dash.appointments"></span></button>
        <button data-tab="progress"><i class="fa-solid fa-chart-line"></i><span data-i18n="dash.progress"></span><span class="count" id="fb-count"></span></button>
        <button data-tab="records"><i class="fa-solid fa-file-medical"></i><span data-i18n="dash.records"></span></button>
        <button data-tab="meds"><i class="fa-solid fa-pills"></i><span data-i18n="dash.meds"></span></button>
        <button data-tab="profile"><i class="fa-regular fa-id-card"></i><span data-i18n="dash.profile"></span></button>
      </nav>
    </aside>
    <div class="dash-main">
      <div data-pane="overview"></div>
      <div data-pane="appointments" class="hidden"></div>
      <div data-pane="progress" class="hidden"></div>
      <div data-pane="records" class="hidden"></div>
      <div data-pane="meds" class="hidden"></div>
      <div data-pane="profile" class="hidden"></div>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/dash.js"></script>
  <script src="assets/js/cases.js"></script>
  <script src="assets/js/pages/patient.js"></script>
</body>
</html>
