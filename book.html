<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC | Book appointment</title>
  <script>(function(){var l='ar';try{l=localStorage.getItem('spc_lang')||'ar';if(!sessionStorage.getItem('spc_intro'))document.documentElement.classList.add('show-intro');}catch(e){}var h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-banner" style="padding:50px 0 44px">
      <img class="banner-bg" src="assets/img/image-8.jpg" alt="">
      <div class="container">
        <div class="crumbs"><a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="nav.book"></span></div>
        <h1 data-i18n="book.title"></h1>
        <p data-i18n="book.sub"></p>
      </div>
    </div>

    <section style="padding-top:40px">
      <div class="container">
        <div id="auth-alert" style="margin-bottom:20px"></div>
        <div class="booking-grid">
          <div>
            <div class="card book-step">
              <div class="step-title"><span>1</span><h2 data-i18n="book.step1"></h2></div>
              <div class="doctor-pick" id="doctor-pick"></div>
              <div class="field" style="margin-top:18px;max-width:420px">
                <label for="service-select" data-i18n="book.service"></label>
                <select id="service-select"></select>
              </div>
            </div>

            <div class="card book-step">
              <div class="step-title"><span>2</span><h2 data-i18n="book.step2"></h2></div>
              <div class="date-strip" id="date-strip"></div>
              <div id="slots-box" style="margin-top:18px"></div>
              <div class="legend">
                <span><i></i><span data-i18n="book.free"></span></span>
                <span><i class="taken-i"></i><span data-i18n="book.taken"></span></span>
                <span><i class="sel-i"></i><span data-i18n="book.selected"></span></span>
              </div>
            </div>

            <div class="card book-step">
              <div class="step-title"><span>3</span><h2 data-i18n="book.step3"></h2></div>
              <div class="field"><label for="notes" data-i18n="book.notes"></label><textarea id="notes"></textarea></div>
            </div>
          </div>

          <aside class="sticky-side">
            <div class="card card-shadow">
              <h3 style="font-size:1.1rem" data-i18n="book.summary"></h3>
              <div id="summary"></div>
              <button class="btn btn-primary btn-block" id="confirm-btn" style="margin-top:18px"><i class="fa-regular fa-calendar-check"></i><span data-i18n="book.confirm"></span></button>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/book.js"></script>
</body>
</html>
