<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC | Login</title>
  <script>(function(){var l='ar';try{l=localStorage.getItem('spc_lang')||'ar';if(!sessionStorage.getItem('spc_intro'))document.documentElement.classList.add('show-intro');}catch(e){}var h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="auth-side" style="background-image:url('assets/img/image-2.jpg')">
      <div><h2 data-i18n="login.sideTitle"></h2><p data-i18n="login.sideText"></p></div>
    </div>
    <div class="auth-form">
      <div class="box">
        <h1 data-i18n="login.title"></h1>
        <p class="muted" data-i18n="login.sub"></p>
        <form id="login-form" style="display:grid;gap:16px;margin-top:24px" novalidate>
          <div class="field"><label for="email" data-i18n="form.email"></label><input id="email" name="email" type="email" autocomplete="username" required></div>
          <div class="field"><label for="password" data-i18n="form.password"></label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
          <div id="login-alert"></div>
          <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i><span data-i18n="login.btn"></span></button>
        </form>
        <p style="margin-top:18px"><span class="muted" data-i18n="login.noAccount"></span> <a id="register-link" href="register.html" style="color:var(--blue);font-weight:700" data-i18n="nav.register"></a></p>
        <p class="muted" style="font-size:.85rem"><i class="fa-solid fa-user-doctor"></i> <span data-i18n="login.staffNote"></span></p>

        <div class="demo-accounts">
          <b data-i18n="login.demo"></b>
          <button type="button" data-demo="patient@spc.com|patient123"><span data-i18n="role.patient"></span><code>patient@spc.com / patient123</code></button>
          <button type="button" data-demo="doctor1@spc.com|doctor123"><span data-i18n="role.doctor"></span><code>doctor1@spc.com / doctor123</code></button>
          <button type="button" data-demo="admin@spc.com|admin123"><span data-i18n="role.admin"></span><code>admin@spc.com / admin123</code></button>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      const next = SPC.qs('next');
      // only allow relative in-site redirects
      const safeNext = next && /^[\w-]+\.html([?#].*)?$/.test(next) ? next : null;
      if (safeNext) document.getElementById('register-link').href = 'register.html?next=' + encodeURIComponent(safeNext);

      const current = SPC.auth.current();
      if (current && !safeNext) location.replace(SPC.auth.dashboardUrl(current.role));

      document.querySelectorAll('[data-demo]').forEach(b => b.addEventListener('click', () => {
        const [e, p] = b.dataset.demo.split('|');
        document.getElementById('email').value = e;
        document.getElementById('password').value = p;
      }));

      document.getElementById('login-form').addEventListener('submit', e => {
        e.preventDefault();
        const u = SPC.auth.login(document.getElementById('email').value, document.getElementById('password').value);
        if (!u) {
          document.getElementById('login-alert').innerHTML = `<div class="alert alert-error">${SPC.t('login.error')}</div>`;
          return;
        }
        location.href = safeNext || SPC.auth.dashboardUrl(u.role);
      });
    })();
  </script>
</body>
</html>
